<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bluetooth Monitor</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>Bluetooth Channel Activity</h2>
<div id="channels"></div>
<div id="rssi-scale">
  <div>-20 dBm</div>
  <div>-40 dBm</div>
  <div>-60 dBm</div>
  <div>-80 dBm</div>
  <div>-100 dBm</div>
</div>

<h2>Devices</h2>
<table id="lap-table">
  <tr><th>LAP</th><th>UAP</th><th>RSSI</th><th>Packets</th></tr>
</table>

<canvas id="gauge" width="300" height="150"></canvas>
<canvas id="channelCanvas" width="1000" height="300"></canvas>
<div id="rssi-gauge">
  <div id="rssi-needle"></div>
  <div id="rssi-label">---</div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
