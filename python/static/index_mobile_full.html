<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bluetooth Monitor</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e27; color: #e0e0e0; padding: 10px; }
.container { max-width: 1400px; margin: 0 auto; }
h1 { text-align: center; color: #00d4ff; margin-bottom: 20px; font-size: clamp(20px, 5vw, 28px); text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
h2 { color: #00d4ff; margin-bottom: 15px; font-size: clamp(14px, 3vw, 18px); text-transform: uppercase; letter-spacing: 1px; }
h3 { color: #00d4ff; margin-bottom: 10px; font-size: 16px; }

.spectrum-section { background: #1a1f3a; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
.spectrum-container { display: flex; align-items: flex-end; gap: 10px; }
#rssi-scale { display: flex; flex-direction: column; justify-content: space-between; height: 200px; font-size: 10px; color: #6b7280; font-family: 'Courier New', monospace; padding-right: 8px; border-right: 1px solid #2a3f5f; }
.scale-item { position: relative; text-align: right; }
.scale-item::after { content: ''; position: absolute; right: -8px; top: 50%; width: 4px; height: 1px; background: #2a3f5f; }
#channels { display: flex; gap: 1px; flex: 1; align-items: flex-end; height: 200px; padding: 10px 5px 25px 5px; background: rgba(0, 0, 0, 0.3); border-radius: 8px; position: relative; overflow-x: auto; }
#channels::before { content: 'Channel'; position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #6b7280; }
.channel { flex: 1; min-width: 6px; max-width: 25px; height: 100%; background: #0f1729; position: relative; border-radius: 2px 2px 0 0; transition: all 0.1s ease; display: flex; flex-direction: column; justify-content: flex-end; }
.channel:hover { background: #1a2238; }
.channel-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 8px; color: #6b7280; font-family: 'Courier New', monospace; white-space: nowrap; }
.bar { position: absolute; bottom: 0; width: 100%; border-radius: 2px 2px 0 0; transition: height 0.2s ease, background 0.2s ease; box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.4); }

.bottom-section { display: grid; grid-template-columns: 1fr; gap: 15px; }
.devices-section { background: #1a1f3a; border-radius: 12px; padding: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); overflow-x: auto; }
#lap-table { width: 100%; border-collapse: collapse; font-family: 'Courier New', monospace; font-size: 12px; }
#lap-table th { background: #0f1729; padding: 10px 8px; text-align: left; color: #00d4ff; font-weight: 600; border-bottom: 2px solid #00d4ff; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; white-space: nowrap; }
#lap-table td { padding: 8px; border-bottom: 1px solid #2a3f5f; }
#lap-table tr { cursor: pointer; transition: all 0.2s ease; }
#lap-table tr:hover { background: rgba(0, 212, 255, 0.1); }
#lap-table tr.selected { background: rgba(0, 212, 255, 0.2); box-shadow: inset 0 0 0 2px rgba(0, 212, 255, 0.5); }
tr.active { animation: pulse 0.5s ease; }
@keyframes pulse { 0%, 100% { background: transparent; } 50% { background: rgba(0, 212, 255, 0.3); } }
.device-name { color: #4caf50; font-weight: 600; }

.btn { padding: 4px 8px; font-size: 11px; border: none; border-radius: 4px; cursor: pointer; font-family: 'Courier New', monospace; transition: all 0.2s ease; }
.btn-ping { background: #00d4ff; color: #0a0e27; font-weight: 600; }
.btn-ping:hover { background: #00b8e6; box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
.btn-ping:disabled { background: #2a3f5f; color: #6b7280; cursor: not-allowed; }

.gauge-section { background: #1a1f3a; border-radius: 12px; padding: 15px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; align-items: center; }
.gauge-container { display: flex; flex-direction: row; align-items: center; gap: 20px; width: 100%; justify-content: center; }
#rssi-gauge { position: relative; width: 60px; height: 200px; border: 2px solid #2a3f5f; background: linear-gradient(to top, #1a0000 0%, #330000 20%, #443300 40%, #334400 60%, #003300 80%, #004400 100%); border-radius: 30px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5); }
#rssi-needle { position: absolute; bottom: 0; width: 100%; height: 3px; background: #ffeb3b; box-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffeb3b, 0 -2px 0 #fff; transition: bottom 0.3s ease; }
.gauge-info-box { display: flex; flex-direction: column; gap: 10px; }
#rssi-label { font-family: 'Courier New', monospace; color: #00d4ff; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
.gauge-info { font-size: 11px; color: #6b7280; }

.modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); }
.modal.show { display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-content { background: #1a1f3a; border-radius: 12px; padding: 20px; max-width: 90%; width: 800px; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); border: 2px solid #2a3f5f; animation: slideIn 0.3s ease; }
@keyframes slideIn { from { transform: translateY(-50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #2a3f5f; }
.modal-header h3 { color: #00d4ff; font-size: 18px; margin: 0; }
.close-btn { background: none; border: none; color: #6b7280; font-size: 28px; cursor: pointer; line-height: 1; padding: 0; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; transition: color 0.2s ease; }
.close-btn:hover { color: #00d4ff; }
.modal-body { display: grid; grid-template-columns: 1fr; gap: 20px; }
.modal-section { background: #0a0e27; border: 1px solid #2a3f5f; border-radius: 8px; padding: 15px; }
#device-info-display { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; font-size: 12px; }
.info-row { display: flex; flex-direction: column; gap: 3px; }
.info-row .label { color: #6b7280; font-size: 10px; text-transform: uppercase; }
.info-row .value { color: #e0e0e0; font-family: 'Courier New', monospace; }
#ping-output { font-family: 'Courier New', monospace; font-size: 12px; color: #e0e0e0; white-space: pre-wrap; word-break: break-all; max-height: 250px; overflow-y: auto; min-height: 80px; }
.ping-status { padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; }
.ping-status.running { background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); color: #00d4ff; }
.ping-status.error { background: rgba(255, 82, 82, 0.1); border: 1px solid rgba(255, 82, 82, 0.3); color: #ff5252; }
.ping-status.success { background: rgba(76, 175, 80, 0.1); border: 1px solid rgba(76, 175, 80, 0.3); color: #4caf50; }

.modal-gauge-container { display: flex; align-items: center; gap: 20px; justify-content: center; }
#modal-rssi-gauge { position: relative; width: 50px; height: 150px; border: 2px solid #2a3f5f; background: linear-gradient(to top, #1a0000 0%, #330000 20%, #443300 40%, #334400 60%, #003300 80%, #004400 100%); border-radius: 25px; overflow: hidden; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5); }
#modal-rssi-needle { position: absolute; bottom: 0; width: 100%; height: 2px; background: #ffeb3b; box-shadow: 0 0 8px #ffeb3b, 0 0 15px #ffeb3b, 0 -1px 0 #fff; transition: bottom 0.3s ease; }
#modal-rssi-label { font-family: 'Courier New', monospace; color: #00d4ff; font-size: 20px; font-weight: bold; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }

@media (min-width: 768px) {
  .spectrum-section { padding: 25px; }
  .devices-section { padding: 25px; }
  .gauge-section { padding: 25px; }
  #rssi-scale { height: 250px; font-size: 11px; }
  #channels { height: 250px; gap: 2px; }
  .channel { min-width: 8px; }
  .channel-label { font-size: 9px; }
  #lap-table { font-size: 13px; }
  #lap-table th { font-size: 11px; padding: 12px; }
  #lap-table td { padding: 10px 12px; }
  #rssi-gauge { width: 80px; height: 250px; }
  .modal-body { grid-template-columns: 2fr 1fr; }
}

@media (min-width: 1024px) {
  body { padding: 20px; }
  h1 { margin-bottom: 30px; }
  .spectrum-section { margin-bottom: 25px; }
  .bottom-section { grid-template-columns: 1fr auto; gap: 25px; }
  .gauge-container { flex-direction: column; gap: 15px; }
  .gauge-section { min-width: 250px; }
  #rssi-label { font-size: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>⚡ Bluetooth Channel Monitor</h1>
  <div class="spectrum-section">
    <h2>Channel Spectrum (0-39)</h2>
    <div class="spectrum-container">
      <div id="rssi-scale">
        <div class="scale-item">-20</div><div class="scale-item">-40</div><div class="scale-item">-60</div><div class="scale-item">-80</div><div class="scale-item">-100</div>
      </div>
      <div id="channels"></div>
    </div>
  </div>
  <div class="bottom-section">
    <div class="devices-section">
      <h2>Discovered Devices</h2>
      <table id="lap-table"><thead><tr><th>LAP</th><th>UAP</th><th>Name</th><th>RSSI</th><th>Packets</th><th>Action</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="gauge-section">
      <h2>RSSI Monitor</h2>
      <div class="gauge-container">
        <div id="rssi-gauge"><div id="rssi-needle"></div></div>
        <div class="gauge-info-box"><div id="rssi-label">---</div><div class="gauge-info">Select a device</div></div>
      </div>
    </div>
  </div>
</div>

<div id="ping-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header"><h3>Device: <span id="ping-device"></span></h3><button class="close-btn" onclick="closePingModal()">&times;</button></div>
    <div class="modal-body">
      <div>
        <div class="modal-section"><h3>Device Info</h3><div id="device-info-display"><div class="info-row"><span class="label">Status</span><span class="value">Connecting...</span></div></div></div>
        <div class="modal-section"><h3>L2Ping</h3><div id="ping-status"></div><div id="ping-output">Initiating...</div></div>
      </div>
      <div class="modal-section"><h3>Live RSSI</h3><div class="modal-gauge-container"><div id="modal-rssi-gauge"><div id="modal-rssi-needle"></div></div><div><div id="modal-rssi-label">---</div><div class="gauge-info">Real-time</div></div></div></div>
    </div>
  </div>
</div>

<script>
const ws=new WebSocket(`ws://${location.host}/ws`);
const laps={},channels=[],channelState=Array(40).fill(null);
let selectedLap=null,selectedUap=null,lastRssiUpdate=0,currentRssi=-100,rssiDecayInterval=null;
let modalRssiDecayInterval=null,modalLastRssiUpdate=0,modalCurrentRssi=-100;

const chanDiv=document.getElementById("channels");
for(let i=0;i<40;i++){
  const d=document.createElement("div");d.className="channel";d.title=`Channel ${i}`;
  const l=document.createElement("div");l.className="channel-label";l.textContent=i;d.appendChild(l);
  chanDiv.appendChild(d);channels.push(d);
}

const RSSI_MIN=-100,RSSI_MAX=-20;
function rssiToPercent(r){r=Math.max(RSSI_MIN,Math.min(RSSI_MAX,r));return((r-RSSI_MIN)/(RSSI_MAX-RSSI_MIN))*100;}
function deviceColor(l,u){const k=((l&0xFFFFFF)<<8)|(u&0xFF);return`hsl(${(k*53)%360},85%,55%)`;}
function formatUAP(u){return u===0xFF?"??":"0x"+u.toString(16).toUpperCase().padStart(2,"0");}
function formatLAP(l){return l.toString(16).toUpperCase().padStart(6,"0");}

ws.onmessage=ev=>{
  const m=JSON.parse(ev.data);
  if(m.type==="init")m.laps.forEach(updateLap);
  //if(m.type==="packet"){updateLap(m);updateChannel(m);if(selectedLap===m.lap&&selectedUap===m.uap){updateRssiGauge(m.rssi);if(document.getElementById('ping-modal').classList.contains('show'))updateModalRssiGauge(m.rssi);}}
  if(m.type==="ping_output")appendPingOutput(m.data);
  if(m.type==="ping_complete")updatePingStatus(m.success?'success':'error',m.success?'Completed':'Failed');
  if(m.type==="device_info")updateDeviceInfo(m);
  //if(m.type==="hci_rssi"){updateLap(m);if(selectedLap===m.lap){updateRssiGauge(m.rssi);if(document.getElementById('ping-modal').classList.contains('show'))updateModalRssiGauge(m.rssi);}}
  if(m.type==="packet"){
    updateLap(m);updateChannel(m);
    const modalOpen=document.getElementById('ping-modal').classList.contains('show');
    if(selectedLap===m.lap&&selectedUap===m.uap&&!modalOpen){
      updateRssiGauge(m.rssi);
    }
  }
  if(m.type==="hci_rssi"){
    updateLap(m);
    if(selectedLap===m.lap){
      updateRssiGauge(m.rssi);
      if(document.getElementById('ping-modal').classList.contains('show'))updateModalRssiGauge(m.rssi);
    }
  }
};

function updateRssiGauge(r){
  currentRssi=r;lastRssiUpdate=Date.now();
  const p=rssiToPercent(r),n=document.getElementById("rssi-needle"),l=document.getElementById("rssi-label");
  n.style.bottom=`${p}%`;l.textContent=`${r} dBm`;
  if(rssiDecayInterval)clearInterval(rssiDecayInterval);
  rssiDecayInterval=setInterval(()=>{
    const e=Date.now()-lastRssiUpdate;
    if(e>3000){const d=e-3000;currentRssi=Math.max(-100,r-(d*80/5000));const p=rssiToPercent(currentRssi);n.style.bottom=`${p}%`;l.textContent=`${Math.round(currentRssi)} dBm`;if(currentRssi<=-100)clearInterval(rssiDecayInterval);}
  },100);
}

function updateModalRssiGauge(r){
  modalCurrentRssi=r;modalLastRssiUpdate=Date.now();
  const p=rssiToPercent(r),n=document.getElementById("modal-rssi-needle"),l=document.getElementById("modal-rssi-label");
  n.style.bottom=`${p}%`;l.textContent=`${r} dBm`;
  if(modalRssiDecayInterval)clearInterval(modalRssiDecayInterval);
  modalRssiDecayInterval=setInterval(()=>{
    const e=Date.now()-modalLastRssiUpdate;
    if(e>3000){const d=e-3000;modalCurrentRssi=Math.max(-100,r-(d*80/5000));const p=rssiToPercent(modalCurrentRssi);n.style.bottom=`${p}%`;l.textContent=`${Math.round(modalCurrentRssi)} dBm`;if(modalCurrentRssi<=-100)clearInterval(modalRssiDecayInterval);}
  },100);
}

function selectLap(l){
  const d=laps[l];if(!d)return;
  selectedLap=d.lap;selectedUap=d.uap;
  document.querySelectorAll('#lap-table tr').forEach(r=>r.classList.remove('selected'));
  document.getElementById("lap-"+l)?.classList.add('selected');
  document.getElementById("rssi-label").textContent="Waiting...";
  if(rssiDecayInterval)clearInterval(rssiDecayInterval);
}

function startL2Ping(l,u){
  selectLap(l);
  document.getElementById('ping-device').textContent=`${formatLAP(l)}:${formatUAP(u)}`;
  document.getElementById('ping-output').textContent='Initiating...';
  document.getElementById('device-info-display').innerHTML='<div class="info-row"><span class="label">Status</span><span class="value">Connecting...</span></div>';
  updatePingStatus('running','Connecting...');
  document.getElementById('ping-modal').classList.add('show');
  fetch('/l2ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lap:l,uap:u})})
  .then(r=>r.json()).then(d=>{if(!d.success)updatePingStatus('error',d.message||'Failed');})
  .catch(e=>updatePingStatus('error','Error: '+e.message));
}

function closePingModal(){
  document.getElementById('ping-modal').classList.remove('show');
  if(modalRssiDecayInterval)clearInterval(modalRssiDecayInterval);
}

function updatePingStatus(t,m){
  const s=document.getElementById('ping-status');s.className=`ping-status ${t}`;s.textContent=m;
}

function appendPingOutput(d){
  const o=document.getElementById('ping-output');o.textContent+=d;o.scrollTop=o.scrollHeight;
}

function updateDeviceInfo(i){
  const c=document.getElementById('device-info-display');
  let h='';
  if(i.name)h+=`<div class="info-row"><span class="label">Name</span><span class="value device-name">${i.name}</span></div>`;
  if(i.class)h+=`<div class="info-row"><span class="label">Class</span><span class="value">${i.class}</span></div>`;
  if(i.manufacturer)h+=`<div class="info-row"><span class="label">Manufacturer</span><span class="value">${i.manufacturer}</span></div>`;
  if(i.lmp_version)h+=`<div class="info-row"><span class="label">LMP Ver</span><span class="value">${i.lmp_version}</span></div>`;
  c.innerHTML=h||'<div class="info-row"><span class="label">Status</span><span class="value">No info available</span></div>';
  if(i.name&&i.lap in laps)laps[i.lap].name=i.name;
}
/*
function updateLap(m){
  laps[m.lap]=m;
  let r=document.getElementById("lap-"+m.lap);
  const c=deviceColor(m.lap,m.uap);
  if(!r){r=document.createElement("tr");r.id="lap-"+m.lap;r.onclick=()=>selectLap(m.lap);r.style.color=c;document.querySelector('#lap-table tbody').appendChild(r);}
  r.classList.add("active");setTimeout(()=>r.classList.remove("active"),500);
  const canPing=m.uap!==0xFF;
  r.innerHTML=`<td>${formatLAP(m.lap)}</td><td>${formatUAP(m.uap)}</td><td class="device-name">${m.name||'-'}</td><td>${m.rssi} dBm</td><td>${m.count}</td><td><button class="btn btn-ping" onclick="event.stopPropagation();startL2Ping(${m.lap},${m.uap})" ${canPing?'':'disabled'}>Ping</button></td>`;
}
*/
function updateLap(m){
  const merged=Object.assign({}, laps[m.lap]||{lap:m.lap,uap:0xFF,name:null,count:0,rssi:m.rssi}, m);
  laps[m.lap]=merged;
  let r=document.getElementById("lap-"+m.lap);
  const c=deviceColor(merged.lap,merged.uap);
  if(!r){r=document.createElement("tr");r.id="lap-"+m.lap;r.onclick=()=>selectLap(m.lap);r.style.color=c;document.querySelector('#lap-table tbody').appendChild(r);}
  r.classList.add("active");setTimeout(()=>r.classList.remove("active"),500);
  const canPing=merged.uap!==0xFF;
  r.innerHTML=`<td>${formatLAP(merged.lap)}</td><td>${formatUAP(merged.uap)}</td><td class="device-name">${merged.name||'-'}</td><td>${merged.rssi} dBm</td><td>${merged.count}</td><td><button class="btn btn-ping" onclick="event.stopPropagation();startL2Ping(${merged.lap},${merged.uap})" ${canPing?'':'disabled'}>Ping</button></td>`;
}
function renderChannels(){
  const now=Date.now();
  for(let ch=0;ch<40;ch++){
    const c=channels[ch],b=c.querySelector('.bar');
    if(b)b.remove();
    const s=channelState[ch];
    if(!s)continue;
    if(now-s.time>1500){channelState[ch]=null;continue;}
    const bar=document.createElement("div");bar.className="bar";
    bar.style.height=`${rssiToPercent(s.rssi)}%`;
    bar.style.background=deviceColor(s.lap,s.uap);
    c.appendChild(bar);
  }
}

function closePingModal(){
  document.getElementById('ping-modal').classList.remove('show');
  if(modalRssiDecayInterval)clearInterval(modalRssiDecayInterval);
  fetch('/l2ping/stop',{method:'POST'}).catch(()=>{});
}
setInterval(renderChannels,100);

function updateChannel(m){channelState[m.channel]={rssi:m.rssi,lap:m.lap,uap:m.uap,time:Date.now()};}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closePingModal();});
document.getElementById('ping-modal').addEventListener('click',e=>{if(e.target.id==='ping-modal')closePingModal();});
</script>
</body>
</html>
